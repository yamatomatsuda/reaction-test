<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <title>反射神経テスト</title>
  <meta name="description" content="画面が緑になった瞬間にタップして反応速度を測るミニゲーム">
  <meta name="theme-color" content="#2f5bd3">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="反射テスト">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>反射神経テスト</h1>
    <div class="best">自己ベスト <b id="best">—</b></div>
  </header>

  <button id="pad" data-s="idle" type="button">
    <div class="big" id="big">タップで<br>スタート</div>
    <div class="sub" id="sub">画面が<b>緑</b>になった瞬間にタップ。5回の平均で判定します。</div>
  </button>

  <div class="dots" id="dots" aria-label="進み具合"></div>
  <footer>赤のうちにタップするとフライング。一般的な平均は 250ms 前後です。</footer>

  <script src="app.js"></script>
</body>
</html>
